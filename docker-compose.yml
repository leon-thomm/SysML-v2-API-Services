version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: sysml2-postgres
    environment:
      POSTGRES_DB: sysml2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sysml2-network

  sysml2-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sysml2-api
    ports:
      - "9000:9000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sysml2
      DB_USER: postgres
      DB_PASSWORD: mysecretpassword
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sysml2-network

volumes:
  postgres_data:

networks:
  sysml2-network:
    driver: bridge
